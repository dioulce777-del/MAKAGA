<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKAGA PRO - Marketplace Dakar - 10 000 FCFA/mois</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

.card{background:#151515;border:1px solid #222;border-radius:18px}
.btn-gold{background:#FFD60A;color:#000;font-weight:800}
.pro-badge{background:linear-gradient(90deg,#FFD60A,#FF9500);color:#000}
</style>
</head>
<body>
<header class="p-4 flex justify-between items-center border-b border-neutral-800 sticky top-0 bg-black/90 backdrop-blur z-50">
<div class="font-black text-2xl">MAKAGA<span class="text-yellow-400">.SHOP</span></div>
<div class="flex gap-2">
<button onclick="showCart()" class="w-10 h-10 rounded-full bg-neutral-900 flex items-center justify-center relative"><i class="fa fa-shopping-bag"></i><span id="cartCount" class="absolute -top-1 -right-1 bg-yellow-400 text-black text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span></button>
<button onclick="openPro()" class="pro-badge px-4 py-2 rounded-full text-xs font-black">PRO 10K</button>
</div>
</header>
<section class="p-4">
<div class="flex gap-2 overflow-auto pb-2">
<button class="px-4 py-2 rounded-full bg-white text-black font-bold text-sm">Tout</button>
<button class="px-4 py-2 rounded-full bg-neutral-800 text-sm">Mode</button>
<button class="px-4 py-2 rounded-full bg-neutral-800 text-sm">Électronique</button>
<button class="px-4 py-2 rounded-full bg-neutral-800 text-sm">Maison</button>
</div>
</section>
<section class="p-4 grid grid-cols-2 gap-3" id="products"></section>
<button onclick="openSell()" class="fixed bottom-6 right-6 w-14 h-14 rounded-full btn-gold flex items-center justify-center text-xl shadow-xl"><i class="fa fa-plus"></i></button>

<div id="sellModal" class="fixed inset-0 bg-black/80 z-[100] hidden overflow-auto">
<div class="bg-neutral-900 m-4 mt-10 rounded-[24px] p-6">
<div class="flex justify-between items-center mb-4"><h2 class="font-black text-xl">Vendre un produit</h2><button onclick="closeSell()" class="w-8 h-8 rounded-full bg-neutral-800">X</button></div>
<p class="text-xs text-neutral-400 mb-4">Photo + Taille + Couleur obligatoires</p>
<input id="pPhoto" type="file" accept="image/*" class="w-full p-3 rounded-xl bg-neutral-800 mb-2 text-sm">
<div id="photoError" class="text-red-500 text-xs hidden mb-2">❌ Photo obligatoire!</div>
<input id="pName" placeholder="Nom du produit" class="w-full p-3 rounded-xl bg-neutral-800 mb-2">
<input id="pPrice" type="number" placeholder="Prix FCFA" class="w-full p-3 rounded-xl bg-neutral-800 mb-2">
